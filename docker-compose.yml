name: memory-bot

x-app: &app
  build: .
  image: memory-bot:latest
  restart: unless-stopped
  env_file: .env
  volumes:
    # config/persona.md 를 메모장으로 고치면 몇 초 안에 반영 (폴더째 마운트)
    - ./config:/app/config:ro
  depends_on:
    falkordb:
      condition: service_started  # 앱이 연결될 때까지 자체 재시도함
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # 그래프 DB (+ 3000번 포트 FalkorDB Browser 포함)
  falkordb:
    image: falkordb/falkordb:latest
    restart: unless-stopped
    environment:
      # AOF 로 매초 디스크에 기록 → 컨테이너가 죽어도 기억이 남는다
      REDIS_ARGS: "--appendonly yes --appendfsync everysec"
    ports:
      - "${FALKORDB_BROWSER_PORT:-3000}:3000"
      # 호스트에서 DB 에 직접 붙어야 할 때만 주석 해제 (기본은 내부망 전용)
      # - "6379:6379"
    volumes:
      - falkordb_data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # 디스코드 봇
  bot:
    <<: *app
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      DATA_DIR: /app/data
    volumes:
      - ./config:/app/config:ro
      - bot_data:/app/data
    # docker stop 시 남은 대화 버퍼를 장기 기억에 저장할 시간을 준다
    stop_grace_period: 2m

  # 기억 관리 웹 (http://<홈서버>:8090)
  admin:
    <<: *app
    command: ["python", "-m", "app.admin"]
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: "8000"
    ports:
      - "${ADMIN_WEB_PORT:-8090}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ---- 외부 접속 (선택) : Tailscale 이 없을 때 Cloudflare Tunnel 로 https 주소 만들기 ----
  # 고정 주소(내 도메인): .env 에 CLOUDFLARE_TUNNEL_TOKEN 넣고  docker compose --profile tunnel up -d
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on: [admin]

  # 임시 주소(계정 불필요, 재시작마다 바뀜): docker compose --profile quicktunnel up -d
  #   주소 확인: docker compose logs quicktunnel | findstr trycloudflare
  quicktunnel:
    image: cloudflare/cloudflared:latest
    profiles: ["quicktunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://admin:8000
    depends_on: [admin]

volumes:
  falkordb_data:
  bot_data:
